services:
  pihole:
    image: pihole/pihole:2026.09.0
    profiles: [network-lab]
    restart: unless-stopped
    ports:
      - "127.0.0.1:1053:53/tcp"
      - "127.0.0.1:1053:53/udp"
    environment:
      TZ: ${TZ:-UTC}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?set in a private env file}
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_misc_etc_dnsmasq_d: "false"
    volumes:
      - ${LAB_DATA_ROOT:-/srv/home-lab}/data/pihole:/etc/pihole
    networks:
      - dns_lab
      - edge_network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, dig, +short, +time=2, +tries=1, "@127.0.0.1", pi.hole]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  dns-test-client:
    image: python:3.12.11-alpine3.22
    profiles: [network-lab]
    restart: unless-stopped
    command: [sleep, infinity]
    volumes:
      - ../../benchmarks/dns/probe.py:/probe.py:ro
    networks:
      - dns_lab
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, python, /probe.py, --server, pihole, --domain, example.com]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  dns_lab:
    name: home-lab-dns
    internal: true
  edge_network:
    name: home-lab-edge
    external: true
