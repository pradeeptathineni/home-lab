# disposable vm for work that should not share host files
base:
  - template:debian-13

vmType: vz
cpus: 2
memory: 4GiB
disk: 20GiB
# Plain mode disables dynamic port forwarding and Lima filesystem sharing.
plain: true
ssh:
  # Plain-mode VZ restart did not restore the vsock proxy on this Intel host.
  overVsock: false
mounts: []
portForwards: []

containerd:
  system: false
  user: false

# user networking keeps the sandbox off direct host and lan bridges
networks:
  - lima: user-v2
