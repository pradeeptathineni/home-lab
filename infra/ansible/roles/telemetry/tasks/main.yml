---
- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure bounded persistent journal storage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-home-lab.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=256M
      RuntimeMaxUse=64M
  notify: Restart journald
