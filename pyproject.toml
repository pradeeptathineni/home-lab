[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "home-lab-control"
version = "0.1.0"
description = "Thin control surface for a portable home lab"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "ansible-core==2.21.4",
  "ansible-lint==25.9.0",
  "jsonschema==4.25.1",
  "pytest==9.0.3",
  "ruff==0.13.2",
  "yamllint==1.37.1",
]

[project.scripts]
labctl = "labctl.cli:main"

[tool.setuptools.packages.find]
include = ["benchmarks*", "labctl*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["labctl/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
